[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx", "typer", "anthropic", "python-dotenv", "openai"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
ai-chat = "ai_chat.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
